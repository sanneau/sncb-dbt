version: 2

sources:
  - name: silver
    description: Silver layer of irail-ingestion (Parquet files)
    tables:
      - name: stations
        config:
          external_location: "read_parquet('{{ env_var('IRAIL_SILVER_DIR') }}/stations/stations.parquet')"
      - name: departures
        config:
          external_location: "read_parquet('{{ env_var('IRAIL_SILVER_DIR') }}/departures/date=*/departures.parquet', hive_partitioning = true)"